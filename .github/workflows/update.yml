name: Update IPTV Playlist

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu yüklə
        uses: actions/checkout@v4

      - name: Python quraşdır
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Playwright yüklə
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Monitoru işə sal və xətanı göstər
        run: |
          mkdir -p output
          python -u monitor.py
