name: Update IPTV Playlist

on:
  workflow_dispatch:
  push:
    paths:
      - 'channels.json'

permissions:
  contents: write

jobs:
  build-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriyanı çək
        uses: actions/checkout@v4

      - name: Python hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: M3U faylını yarat
        run: |
          python scraper.py

      - name: playlist.m3u faylını göndər
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --staged --quiet || git commit -m "Auto-update playlist [skip ci]"
          git push origin main || echo "Yenilik yoxdur"
