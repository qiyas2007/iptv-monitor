name: Auto Scrape IPTV

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu çək
        uses: actions/checkout@v4

      - name: Python quraşdır
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kanalları oxu və M3U yarat
        run: |
          python scraper.py

      - name: playlist.m3u faylını göndər
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          # Dəyişiklik olmasa belə xəta vermədən keçməsi üçün:
          git diff --staged --quiet || git commit -m "Auto-update playlist [skip ci]"
          git push origin main || echo "Push ediləcək yeni dəyişiklik tapılmadı"
